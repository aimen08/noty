name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          # the page inlines its images, but crawlers fetch these by URL
          cp site/og.png site/apple-touch-icon.png site/favicon-32.png \
             site/icon-512.png site/icon.png _site/
          sed 's|noty-sepia.vercel.app|aimen08.github.io/noty|g' site/robots.txt  > _site/robots.txt
          sed 's|noty-sepia.vercel.app|aimen08.github.io/noty|g' site/sitemap.xml > _site/sitemap.xml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
