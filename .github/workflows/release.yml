name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be numeric SemVer (X.Y.Z)"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            # a monotonic build number Sparkle can compare
            echo "build=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Sparkle
        run: ./scripts/fetch-sparkle.sh

      - name: Build
        env:
          MARKETING_VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ steps.v.outputs.build }}
        run: |
          ./build.sh release
          codesign --verify --deep --strict build/Noty.app

      - name: Package the disk image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./scripts/make-dmg.sh "$VERSION"

      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set — updates cannot be signed."
            exit 1
          fi
          KEYFILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          echo "key bytes: $(wc -c < "$KEYFILE")"
          test -x ./Sparkle/bin/sign_update
          NOTES="$(git log -1 --pretty=%B | python3 -c 'import html,sys; print("<p>"+html.escape(sys.stdin.read().strip()).replace(chr(10),"<br>")+"</p>")')" \
          ./scripts/make-appcast.sh \
            "build/Noty-${VERSION}.dmg" \
            "$KEYFILE" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Noty-${VERSION}.dmg"
          rm -f "$KEYFILE"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          V="$VERSION"
          # A stable filename as well, so the website's download link never has to
          # be edited. Sparkle keeps using the versioned one named in the appcast.
          cp "build/Noty-${V}.dmg" build/Noty.dmg
          gh release create "$TAG" \
            "build/Noty-${V}.dmg" build/Noty.dmg \
            --title "Noty ${V}" \
            --generate-notes \
            --latest || \
          gh release upload "$TAG" \
            "build/Noty-${V}.dmg" build/Noty.dmg --clobber

      - name: Commit the appcast so Sparkle can see the update
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast unchanged"
          else
            git commit -m "Release ${VERSION}: update appcast"
            git push origin HEAD:main
          fi
